name: CI

on:
  pull_request:
    branches-ignore: [main, production]
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

jobs:
  deployment:
    name: Deployment script guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/oracle/deploy.sh deploy/oracle/release.sh
      - run: python3 -m unittest discover -s deploy/oracle/tests -v

  frontend:
    name: ESLint, Prettier, Jest and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:eslint
      - run: npm run lint:ts
      - run: npm test
      - run: npm run build

  backend:
    name: Ruff and pytest
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: factory_test
          POSTGRES_PASSWORD: category-ci-only
          POSTGRES_DB: factory_categories_ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U factory_test -d factory_categories_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://factory_test:category-ci-only@127.0.0.1:55439/factory_categories_ci
      CATEGORY_TEST_DATABASE_URL: postgresql://factory_test:category-ci-only@127.0.0.1:55439/factory_categories_ci
    defaults:
      run:
        working-directory: backend/app/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
          python-version: '3.12'
      - run: uv venv
      - run: uv pip install --require-hashes -r requirements.txt
      - run: uv pip install pytest==7.4.4 ruff==0.1.15
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: uv run --no-project prisma generate
      - run: uv run --no-project prisma migrate deploy
      - run: uv run --no-project python verify_category_migration.py
      - run: uv run --no-project ruff check --config pyproject.toml .
      - run: uv run --no-project pytest tests/ -q

  commitlint:
    name: Commitlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git merge-base --is-ancestor "$BASE_SHA" HEAD 2>/dev/null; then
            npx --no-install commitlint --from "$BASE_SHA" --to HEAD --verbose
          else
            git log -1 --format=%B | npx --no-install commitlint --verbose
          fi
