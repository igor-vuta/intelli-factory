version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: intelli-factory-postgres
    environment:
      POSTGRES_USER: intelli_user
      POSTGRES_PASSWORD: intelli_pass
      POSTGRES_DB: intelli_factory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelli_user -d intelli_factory"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: intelli-factory-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@intelli-factory.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
